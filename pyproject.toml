[project]
name = "analysis-of-banking-operations"
version = "0.1.0"
description = ""
authors = [
    {name = "Evgenii Osipenko",email = "e.s.osipenko33@gmail.com"}
]
requires-python = ">=3.14,<4.0"
dependencies = [
    "pandas (>=3.0.5,<4.0.0)",
    "pandas-stubs (==3.0.5.260730)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "load-dotenv (>=0.1.0,<0.2.0)",
    "poetry-core (>=2.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[tool.poetry]
name = "analysis-of-banking-operations"
version = "0.1.0"
packages = [{include = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "isort (>=9.0.1,<10.0.0)"
]

[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true

[tool.black]
line-length = 119
target-version = ['py314']
preview = true

[tool.isort]
profile = "black"
line_length = 119
multi_line_output = 3
include_trailing_comma = true
